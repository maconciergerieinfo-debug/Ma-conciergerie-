<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma Conciergerie | Auto & Maison</title>
<style>
:root{--pink:#f44f9d;--gold:#e6b64a;--dark:#100b12;--card:#241522}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#351526,#100b12 55%);color:#fff;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:24px}.brand{text-align:center}.brand h1{font-family:cursive;font-size:42px;margin:0;color:#fff}.brand h1 span{color:var(--pink)}.tag{color:var(--pink);font-weight:800;font-size:18px}
.box{background:rgba(36,21,34,.96);border:1px solid rgba(230,182,74,.55);border-radius:24px;padding:22px;margin:22px 0;box-shadow:0 8px 30px #0006}
h2{margin-top:0;color:#fff}.pink{background:linear-gradient(90deg,#ff75b4,#a30055);padding:10px 18px;border-radius:999px;display:inline-block;color:#fff}
input,textarea,select{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #765164;background:#120d13;color:#fff;font-size:16px}
button{background:linear-gradient(90deg,var(--pink),#b00062);border:0;border-radius:999px;padding:13px 20px;color:white;font-weight:800;font-size:16px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.stat{padding:20px;border-radius:18px;background:#170f17;border:1px solid #5d344d}.num{font-size:32px;color:var(--gold);font-weight:900}
.row{padding:14px;border-bottom:1px solid #4c3041}.small{color:#d8c9d1;font-size:14px}.hidden{display:none}.error{color:#ff9bc8;margin-top:10px}
footer{text-align:center;color:#d9a6bd;padding:15px}.logout{float:right;background:transparent;border:1px solid #9b5476}
</style></head>
<body><main class="wrap">
<div class="brand"><h1>Ma <span>Conciergerie</span></h1><div>Auto <span style="color:#f44f9d">& Maison</span></div><p class="tag">Votre alliée de confiance pour faciliter votre quotidien.</p></div>

<section id="login" class="box"><h2 class="pink">🔐 Connexion</h2><p class="small">Accédez à votre espace Ma Conciergerie.</p>
<input id="email" type="email" placeholder="Votre e-mail"><input id="password" type="password" placeholder="Votre mot de passe">
<button onclick="login()">Se connecter</button><div id="error" class="error"></div></section>

<section id="app" class="hidden">
<button class="logout" onclick="logout()">Déconnexion</button>
<div class="box"><h2>🌸 Bonjour, <span id="username"></span></h2><div class="grid">
<div class="stat">CLIENTES<div id="clientsCount" class="num">–</div></div>
<div class="stat">DOSSIERS<div id="dossiersCount" class="num">–</div></div>
<div class="stat">EN COURS<div id="openCount" class="num">–</div></div></div></div>

<div class="box" id="adminPanel"><h2 class="pink">👩 Ajouter une cliente</h2>
<input id="cname" placeholder="Nom de la cliente"><input id="cemail" type="email" placeholder="E-mail"><input id="cphone" placeholder="Téléphone">
<button onclick="addClient()">Ajouter la cliente</button><h3>Mes clientes</h3><div id="clientsList"></div></div>

<div class="box"><h2 class="pink">📁 Dossiers</h2><div id="newDossier">
<input id="dtitle" placeholder="Titre du dossier"><input id="demail" placeholder="E-mail de la cliente">
<select id="dstatus"><option>Nouveau</option><option>En cours</option><option>En attente</option><option>Terminé</option></select>
<textarea id="dnotes" placeholder="Notes"></textarea><button onclick="addDossier()">Créer le dossier</button></div>
<div id="dossiersList"></div></div></section>
<footer>📞 +32 471 83 00 32 · Disponible dans toute la Belgique 🇧🇪</footer>
</main>
<script>
const API_URL = "https://ma-conciergerie-p0en.onrender.com";
let token=localStorage.token||"", user=null;
async function api(url,opt={}){
  opt.headers={
    ...(opt.headers||{}),
    "Content-Type":"application/json",
    ...(token?{Authorization:"Bearer "+token}:{})
  };

  let r=await fetch(API_URL + url,opt);
  let j=await r.json();

  if(!r.ok) throw new Error(j.error||"Erreur");
  return j;
}
async function login() {
  const errorBox = document.getElementById("error");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  errorBox.textContent = "Connexion en cours...";

  try {
    const j = await api("/api/login", {
      method: "POST",
      body: JSON.stringify({
        email: emailInput.value,
        password: passwordInput.value
      })
    });

    token = j.token;
    user = j.user;
    localStorage.token = token;
    showApp();

  } catch (e) {
    errorBox.textContent = "Erreur : " + e.message;
  }
}
function logout(){localStorage.clear();location.reload()}
async function showApp() {
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  try {
    const payload = JSON.parse(atob(token.split(".")[1]));
    user = payload;

    document.getElementById("username").textContent = user.name || "";

    if (user.role !== "admin") {
      document.getElementById("adminPanel").classList.add("hidden");
      document.getElementById("newDossier").classList.add("hidden");
    }

    await refresh();
  } catch (e) {
    console.error(e);
    logout();
  }
}
async function refresh(){let d=await api("/api/dashboard");clientsCount.textContent=d.clients;dossiersCount.textContent=d.dossiers;openCount.textContent=d.dossiersOuverts;let ds=await api("/api/dossiers");dossiersList.innerHTML="<h3>Mes dossiers</h3>"+(ds.length?ds.map(x=>`<div class="row"><b>${x.title}</b> · ${x.status}<br><span class="small">${x.clientEmail}</span></div>`).join(""):"<p class='small'>Aucun dossier pour le moment.</p>");if(user.role==="admin"){let cs=await api("/api/clients");clientsList.innerHTML=cs.length?cs.map(x=>`<div class="row"><b>${x.name}</b><br><span class="small">${x.email} · ${x.phone||""}</span></div>`).join(""):"<p class='small'>Aucune cliente pour le moment.</p>"}}
async function addClient(){try{await api("/api/clients",{method:"POST",body:JSON.stringify({name:cname.value,email:cemail.value,phone:cphone.value})});cname.value=cemail.value=cphone.value="";await refresh()}catch(e){alert(e.message)}}
async function addDossier(){try{await api("/api/dossiers",{method:"POST",body:JSON.stringify({title:dtitle.value,clientEmail:demail.value,status:dstatus.value,notes:dnotes.value})});dtitle.value=demail.value=dnotes.value="";await refresh()}catch(e){alert(e.message)}}
if(token)showApp();
</script></body></html>
